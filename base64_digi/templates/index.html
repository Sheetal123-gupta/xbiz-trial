<!DOCTYPE html>
<html>
<head>
    <title>Document OCR</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: Arial; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .result img { max-width: 100%; margin-top: 10px; border: 1px solid #ccc; }
        textarea { width: 100%; height: 200px; }
    </style>
</head>
<body>
<div class="container">
    <h2 class="mb-4">📄 Upload Document Image</h2>
    
    <form method="POST" enctype="multipart/form-data" class="mb-4">
        <div class="mb-3">
            <input type="file" name="file" accept="image/*" required class="form-control">
        </div>
        <button type="submit" class="btn btn-primary">Upload & Process</button>
    </form>

    {% if result %}
    <hr>
    
    <h3 class="mt-4">✅ Detected Document Type:</h3>
    <p><strong class="text-primary">{{ result.document_type }}</strong></p>

    <h3 class="mt-4">📝 Extracted Text:</h3>
    <textarea readonly class="form-control mb-4">{{ result.text }}</textarea>

    {% if result.annotated_image %}
    <h3 class="mt-4">📦 Annotated Image:</h3>
    <div class="result">
        <img src="{{ url_for('static', filename='uploads/' + result.annotated_image) }}" class="img-fluid rounded border">
    </div>
    {% endif %}

    {% if result.comparison_image %}
    <h3 class="mt-4">🔁 Comparison Image:</h3>
    <div class="result">
        <img src="{{ url_for('static', filename='uploads/' + result.comparison_image) }}" class="img-fluid rounded border">
    </div>
    {% endif %}
    
    {% endif %}
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
