<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload PDF</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white text-center">
            <h4 class="mb-0">------ Upload Your PDF -----</h4>
          </div>
          <div class="card-body">
            <form id="pdfForm" action="/process_pdf" method="post" enctype="multipart/form-data">
              <div class="mb-3">
                <label for="pdfFile" class="form-label">Choose PDF File</label>
                <input type="file" class="form-control" id="pdfFile" name="pdf" accept="application/pdf" required />
              </div>
              <button type="submit" class="btn btn-success w-100">Upload PDF</button>
            </form>

            <div id="successMessage" class="alert alert-success mt-4 text-center d-none" role="alert">
              ✅ Completed – Document type extracted.
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('pdfForm').addEventListener('submit', function () {
      // Show success message after form submission
      document.getElementById('successMessage').classList.remove('d-none');
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
